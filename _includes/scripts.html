<script type="module" src="{{ base_path }}/assets/js/main.min.js"></script>

<!-- The greedy/priority-plus nav measures link widths once at startup, which can
     happen before web fonts finish loading and report widths that are too small
     (so it fails to collapse overflowing links into the menu on small screens).
     Nudge it to recalculate once everything has settled. jQuery (inside the
     module bundle) listens for the native resize event. -->
<script>
  (function () {
    var renudge = function () {
      window.dispatchEvent(new Event('resize'));
    };
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(renudge);
    }
    window.addEventListener('load', function () { setTimeout(renudge, 60); });
  })();
</script>

{% include base_path %}

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

{% include seo.html %}

{% unless site.atom_feed.hide %}<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">{% endunless %}

<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f9f7f2">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171614">

{% comment %} Pre-paint: apply the stored theme before the stylesheet so dark never flashes; swap no-js → js. {% endcomment %}
<script>(function(d){try{var t=localStorage.getItem('theme');if(t==='dark'||t==='light'){d.setAttribute('data-theme',t);var c=t==='dark'?'#171614':'#f9f7f2',m=document.querySelectorAll('meta[name=theme-color]');for(var i=0;i<m.length;i++)m[i].setAttribute('content',c)}}catch(e){}d.className=d.className.replace(/\bno-js\b/,'js')})(document.documentElement)</script>

<link rel="preload" href="{{ base_path }}/assets/fonts/Newsreader.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ base_path }}/assets/fonts/Newsreader-Italic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ base_path }}/assets/fonts/PlexMono-Regular.woff2" as="font" type="font/woff2" crossorigin>

<link rel="stylesheet" href="{{ base_path }}/assets/css/site.css">

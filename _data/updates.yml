# Home page "Updates!" list. Rendered by _includes/updates.html, which
# _pages/about.md pulls in with {% include updates.html show=4 %}.
#
# ORDER IS AUTHORED: newest first. The include shows the first `show` entries
# (default 4) and folds everything after them into a <details>, so a new entry
# goes at the top of this file and the oldest one falls into the fold on its
# own. Nothing here is sorted or filtered at build time.
#
# Fields
#   date  (required)  Display string for the mono date column, printed
#                     verbatim. Quoted ISO yyyy-mm-dd, matching the column's
#                     tabular-nums setting; quote it so YAML keeps it a string
#                     rather than a Date, and no display filter is needed.
#   text  (required)  The News cell, written as inline markdown (links, **bold**
#                     and raw inline HTML all work; it goes through
#                     `markdownify`, the same kramdown pass the table used, and
#                     the wrapping <p> is stripped). Use a >- block so nothing
#                     needs YAML escaping.
#   tag   (optional)  Venue abbreviation, e.g. ICML. Rendered ahead of the text
#                     as <span class="pub-tag pub-tag--icml">ICML</span>; the
#                     class is the abbreviation downcased, and the colour comes
#                     from --tag-<abbr> in _sass/site/_tokens.scss (icml, icwsm,
#                     emnlp today). An abbreviation with no token of its own
#                     still styles: .pub-tag's --tag-default carries it.

